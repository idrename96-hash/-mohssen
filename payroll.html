<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الرواتب وفئات النقدية | البحيرات الدولية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3c72;
            --primary-light: #2a5298;
            --accent: #00b09b;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-gray: #666666;
            --border-color: #e1e4e8;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .back-btn {
            background-color: var(--primary);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background-color: var(--accent);
        }

        h2 {
            color: var(--primary);
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
        }

        .denominations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .denom-box {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .denom-box label {
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .denom-box input {
            text-align: center;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #e6fffa;
            border: 1px solid #b2f5ea;
            border-radius: 10px;
            text-align: center;
        }

        .result-section h3 {
            margin: 0;
            color: #234e52;
            font-size: 20px;
        }

        .calc-btn {
            background: linear-gradient(to left, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
        }

        .calc-btn:hover {
            background: linear-gradient(to left, var(--accent), #1de9b6);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>نظام الرواتب وفئات النقدية</h2>
            <a href="index.html" class="back-btn">العودة للرئيسية</a>
        </div>

        <div class="form-group">
            <label for="emp-name">اسم الموظف:</label>
            <input type="text" id="emp-name" placeholder="أدخل اسم الموظف">
        </div>

        <div class="form-group">
            <label for="total-salary">إجمالي الراتب المستحق:</label>
            <input type="number" id="total-salary" placeholder="0.00">
        </div>

        <h3>تفصيل فئات النقدية (العملات):</h3>
        <div class="denominations-grid">
            <div class="denom-box">
                <label>500 ريال</label>
                <input type="number" class="denom-input" data-val="500" value="0" min="0">
            </div>
            <div class="denom-box">
                <label>200 ريال</label>
                <input type="number" class="denom-input" data-val="200" value="0" min="0">
            </div>
            <div class="denom-box">
                <label>100 ريال</label>
                <input type="number" class="denom-input" data-val="100" value="0" min="0">
            </div>
            <div class="denom-box">
                <label>50 ريال</label>
                <input type="number" class="denom-input" data-val="50" value="0" min="0">
            </div>
            <div class="denom-box">
                <label>20 ريال</label>
                <input type="number" class="denom-input" data-val="20" value="0" min="0">
            </div>
            <div class="denom-box">
                <label>10 ريال</label>
                <input type="number" class="denom-input" data-val="10" value="0" min="0">
            </div>
            <div class="denom-box">
                <label>5 ريال</label>
                <input type="number" class="denom-input" data-val="5" value="0" min="0">
            </div>
            <div class="denom-box">
                <label>1 ريال</label>
                <input type="number" class="denom-input" data-val="1" value="0" min="0">
            </div>
        </div>

        <button class="calc-btn" onclick="calculateTotal()">حساب ومطابقة النقدية</button>

        <div class="result-section">
            <h3 id="result-text">إجمالي الفئات المدخلة: 0 ريال</h3>
        </div>
    </div>

    <script>
        function calculateTotal() {
            const inputs = document.querySelectorAll('.denom-input');
            let sum = 0;

            inputs.forEach(input => {
                const count = parseFloat(input.value) || 0;
                const value = parseFloat(input.getAttribute('data-val'));
                sum += count * value;
            });

            const totalSalary = parseFloat(document.getElementById('total-salary').value) || 0;
            const resultText = document.getElementById('result-text');

            if (totalSalary > 0) {
                if (sum === totalSalary) {
                    resultText.innerHTML = `إجمالي الفئات: ${sum} ريال <br><span style="color: green;">✔ متطابق تماماً مع الراتب المستحق</span>`;
                } else {
                    resultText.innerHTML = `إجمالي الفئات: ${sum} ريال <br><span style="color: red;">✖ غير متطابق (الراتب: ${totalSalary} ريال)</span>`;
                }
            } else {
                resultText.innerHTML = `إجمالي الفئات المدخلة: ${sum} ريال`;
            }
        }
    </script>

</body>
</html>
