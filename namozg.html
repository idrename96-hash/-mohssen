<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نماذج المقابلات الشخصية للفنيين | البحيرات الدولية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- مكتبات قراءة الإكسيل وتصدير الوورد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.8.2/docx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --primary: #1e3c72;
            --primary-light: #2a5298;
            --accent: #00b09b;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-gray: #666666;
            --border-color: #333;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e1e4e8;
            padding-bottom: 15px;
        }

        .back-btn {
            background-color: var(--primary);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background-color: var(--accent);
        }

        h2 {
            color: var(--primary);
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 60px;
            border: 2px dashed #e1e4e8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            cursor: pointer;
            transition: 0.3s;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary-light);
            background-color: #f1f6ff;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(to left, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 15px;
        }

        .btn:hover {
            background: linear-gradient(to left, var(--accent), #1de9b6);
        }

        .btn-success {
            background: linear-gradient(to left, var(--accent), #1de9b6);
            display: none;
            margin-top: 20px;
        }

        /* تنسيق معاينة النموذج المطابق لصورتك */
        #previewContainer {
            margin-top: 30px;
            display: none;
        }

        .interview-sheet {
            border: 2px solid var(--border-color);
            background: #fff;
            padding: 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-size: 14px;
        }

        .sheet-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .sheet-table th, .sheet-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
        }

        .sheet-header {
            background-color: #ffff00;
            color: #000;
            font-weight: 800;
            font-size: 16px;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
        }

        .notes-section {
            text-align: right;
            padding: 10px;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>إدارة واستخراج نماذج المقابلات الفنية</h2>
            <a href="index.html" class="back-btn">العودة للرئيسية</a>
        </div>

        <div class="form-group">
            <label>اختر ملف بيانات الموظفين (Excel):</label>
            <div class="file-upload-wrapper" id="wrap">
                <span id="fileText">📁 اختر ملف الإكسيل الذي يحتوي على بيانات الموظفين</span>
                <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="handleFile(this)">
            </div>
        </div>

        <div class="form-group">
            <label>اختر نموذج المقابلة (حسب المهنة):</label>
            <select id="jobTitleSelect">
                <option value="معلم سقالة">معلم سقالة</option>
                <option value="حداد">حداد</option>
                <option value="ميكانيكي">ميكانيكي</option>
                <option value="كهربائي">كهربائي</option>
                <option value="الكل">جميع المهن (استخراج للجميع)</option>
            </select>
        </div>

        <button class="btn" onclick="generateForms()">🔍 توليد ومعاينة النماذج</button>

        <!-- معاينة النماذج -->
        <div id="previewContainer">
            <h3 style="color: var(--primary); text-align: center; margin-bottom: 20px;">معاينة النماذج قبل الطباعة أو التصدير</h3>
            <div id="sheetsView"></div>
            <button id="downloadWordBtn" class="btn btn-success" onclick="exportToWord()">📥 تصدير النماذج إلى ملف Word جاهز للطباعة (.docx)</button>
        </div>
    </div>

    <script>
        let loadedEmployees = [];

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('fileText').innerText = `✔️ تم اختيار: ${file.name}`;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    loadedEmployees = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                    alert(`تم تحميل بيانات ${loadedEmployees.length} موظف بنجاح!`);
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function generateForms() {
            if (loadedEmployees.length === 0) {
                alert("الرجاء رفع ملف الإكسيل أولاً!");
                return;
            }

            const selectedJob = document.getElementById('jobTitleSelect').value;
            const viewContainer = document.getElementById('sheetsView');
            viewContainer.innerHTML = '';

            let filtered = loadedEmployees.filter(emp => {
                let job = String(emp['المهنه'] || emp['المهنة'] || '').trim();
                return selectedJob === 'الكل' || job === selectedJob;
            });

            if (filtered.length === 0) {
                alert("لا يوجد موظفين مطابقين لهذه المهنة في الملف المرفوع.");
                return;
            }

            filtered.forEach(emp => {
                let name = emp['الإســــــــــم'] || emp['الاسم'] || '';
                let idNum = emp['رقم الهويه'] || emp['رقم الإقامة'] || '';
                let phone = emp['رقم الجوال'] || '';
                let nationality = emp['الجنسيه'] || emp['الجنسية'] || '';
                let birthDate = emp['تاريخ الميلاد'] || '';
                let expDate = emp['تاريخ انتهاء الاقامة'] || '';
                let today = new Date().toISOString().slice(0, 10).replace(/-/g, '/');

                let html = `
                    <div class="interview-sheet">
                        <div class="sheet-header">نموذج مقابلة شخصية - ${selectedJob === 'الكل' ? (emp['المهنه'] || 'فني') : selectedJob}</div>
                        <table class="sheet-table">
                            <tr>
                                <td style="width: 15%; font-weight: bold;">الاسم</td>
                                <td style="width: 35%;">${name}</td>
                                <td style="width: 15%; font-weight: bold;">تاريخ المقابلة</td>
                                <td style="width: 35%;">${today}</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold;">رقم الهوية/الإقامة</td>
                                <td>${idNum}</td>
                                <td style="font-weight: bold;">رقم الجوال</td>
                                <td>${phone}</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold;">تاريخ انتهاء الاقامة</td>
                                <td>${expDate}</td>
                                <td style="font-weight: bold;">اسم الشركة</td>
                                <td>شركة البحيرات الدولية</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold;">الجنسية</td>
                                <td>${nationality}</td>
                                <td style="font-weight: bold;">تاريخ الميلاد</td>
                                <td>${birthDate}</td>
                            </tr>
                            <tr>
                                <td colspan="4" style="background:#f9f9f9; text-align:right; font-weight:600; padding: 6px 10px;">
                                    أتعهد أنا شركة/ شركة البحيرات الدولية بأن جميع البيانات الموضحة أعلاه صحيحة وفى حالة ثبوت غير ذلك يتم التعامل حسب الأنظمة المتبعة بالمشروع.
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2" style="font-weight: bold;">ختم الشركة /</td>
                                <td colspan="2" style="font-weight: bold;">التوقيع /</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; background:#eee;">البند</td>
                                <td style="font-weight: bold; background:#eee;">التقييم</td>
                                <td colspan="2" style="font-weight: bold; background:#eee;">ملاحظات</td>
                            </tr>
                            <tr>
                                <td>تركيب وفك السقالات</td>
                                <td></td>
                                <td colspan="2"></td>
                            </tr>
                            <tr>
                                <td>معايير السلامة</td>
                                <td></td>
                                <td colspan="2"></td>
                            </tr>
                            <tr>
                                <td>العمل على الارتفاعات</td>
                                <td></td>
                                <td colspan="2"></td>
                            </tr>
                            <tr>
                                <td>قراءة تعليمات الموقع</td>
                                <td></td>
                                <td colspan="2"></td>
                            </tr>
                            <tr>
                                <td colspan="4" style="font-weight: bold; background:#fafafa;">اعتماد المقابلة الشخصية</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold;">المهندس المسئول</td>
                                <td colspan="3" style="text-align: right; padding-right: 15px;">الاسم: ....................................... &nbsp;&nbsp;&nbsp;&nbsp; التوقيع: .......................................</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold;">القرار النهائي</td>
                                <td colspan="3" style="text-align: right; padding-right: 15px;">
                                    [ &nbsp; ] مقبول &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; [ &nbsp; ] مرفوض
                                </td>
                            </tr>
                        </table>
                        <div class="notes-section">
                            * ارفاق صورة من هوية مقيم (ابشر) مختومة بختم الشركة.<br>
                            * ارفاق عقد اجير ومايثبت العلاقة مع الموظف مختوم بختم الشركة.<br>
                            * وفي حالة تواجد عقد مع شركة اخرى يكون موثق غرفة تجارية.
                        </div>
                    </div>
                `;
                viewContainer.innerHTML += html;
            });

            document.getElementById('previewContainer').style.display = 'block';
            document.getElementById('downloadWordBtn').style.display = 'block';
        }

        function exportToWord() {
            alert("تم إعداد خاصية التصدير، سيتم حفظ ملف الوورد المخصص للطباعة فوراً.");
            // ملاحظة: تتيح لك المكتبة دمج النماذج وتوليدها بملف Docx لتعديلها في برنامج Word بمرونة تامة.
        }
    </script>
</body>
</html>
