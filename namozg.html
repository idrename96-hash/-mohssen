<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نماذج المقابلات والتصاريح | البحيرات الدولية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --primary: #1e3c72; --primary-light: #2a5298; --accent: #00b09b;
            --bg-color: #f0f2f5; --card-bg: #ffffff; --text-dark: #333333; --border-color: #333;
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; direction: rtl; text-align: right; color: var(--text-dark); }
        .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e1e4e8; padding-bottom: 15px; }
        .back-btn { background-color: var(--primary); color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 14px; }
        h2 { color: var(--primary); margin: 0; }
        .form-group { margin-bottom: 20px; }
        .label-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        label { font-weight: 600; color: var(--primary); margin: 0; }
        .btn-template { background: linear-gradient(to left, #27ae60, #2ecc71); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-template:hover { background: linear-gradient(to left, #219653, #27ae60); }
        
        .file-upload-wrapper { position: relative; width: 100%; height: 60px; border: 2px dashed #e1e4e8; border-radius: 8px; display: flex; align-items: center; justify-content: center; background-color: #fafafa; cursor: pointer; transition: 0.3s; margin-bottom: 15px; }
        .file-upload-wrapper:hover { border-color: var(--primary-light); background-color: #f1f6ff; }
        .file-upload-wrapper input[type="file"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .btn { background: linear-gradient(to left, var(--primary), var(--primary-light)); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:hover { background: linear-gradient(to left, var(--accent), #1de9b6); }
        .btn-permit { background: linear-gradient(to left, #8e44ad, #9b59b6); margin-top: 15px; }
        .btn-permit:hover { background: linear-gradient(to left, #732d91, #8e44ad); }
        .btn-success { background: linear-gradient(to left, var(--accent), #1de9b6); display: none; margin-top: 20px; }

        #previewContainer { margin-top: 30px; display: none; }
        
        /* تنسيق نموذج المقابلة */
        .interview-sheet { border: 2px solid var(--border-color); background: #fff; margin-bottom: 40px; font-size: 14px; direction: rtl; page-break-after: always; }
        .sheet-table { width: 100%; border-collapse: collapse; text-align: right; }
        .sheet-table th, .sheet-table td { border: 1px solid var(--border-color); padding: 8px 10px; vertical-align: middle; }
        .sheet-header { background-color: #ffff00; color: #000; font-weight: 800; font-size: 16px; padding: 10px; text-align: center; border-bottom: 2px solid var(--border-color); }
        .photo-cell { width: 15%; background: #fafafa; color: #666; font-size: 12px; font-weight: 600; text-align: center; }

        /* حاوية التصريح الثابتة */
        .permit-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 40px auto;
            page-break-after: always;
            background: #fff;
            border: 1px solid #ddd;
            overflow: hidden;
        }

        /* تنسيق النصوص فوق صورة التصريح (ثابتة تماماً بدون سحب) */
        .overlay-text {
            position: absolute;
            font-family: 'Arial', 'Cairo', sans-serif;
            font-weight: bold;
            font-size: 13px;
            color: #000;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>إدارة واستخراج نماذج المقابلات والتصاريح[cite: 6]</h2>
            <a href="index.html" class="back-btn">العودة للرئيسية[cite: 6]</a>
        </div>

        <div class="form-group">
            <div class="label-container">
                <label>الخطوة 1: حمل قالب الإكسيل المنظم[cite: 6]:</label>
                <button class="btn-template" onclick="downloadTemplate()">📥 تحميل القالب الفارغ المجدول[cite: 6]</button>
            </div>
        </div>

        <div class="form-group">
            <label>الخطوة 2: اختر ملف الإكسيل بعد تعبئته بالبيانات[cite: 6]:</label>
            <div class="file-upload-wrapper">
                <span id="fileText">📁 اضغط هنا لاختيار ملف البيانات (Excel)[cite: 6]</span>
                <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="handleFile(this)">
            </div>
        </div>

        <button class="btn" onclick="generateAllForms()">⚡ توليد نماذج المقابلات الشخصية[cite: 6]</button>
        <button class="btn btn-permit" onclick="generatePermits()">📝 توليد نماذج تصاريح الدخول[cite: 6]</button>

        <div id="previewContainer">
            <h3 style="color: var(--primary); text-align: center; margin-bottom: 20px;" id="resultsTitle"></h3>
            <div id="sheetsView"></div>
            <button id="downloadWordBtn" class="btn btn-success" onclick="exportToWord()">📥 طباعة النماذج أو حفظها (Ctrl+P)[cite: 6]</button>
        </div>
    </div>

    <script>
        let loadedEmployees = [];
        const bgImageUrl = 'permit_bg.jpg'; 

        // إحداثياتك النهائية المضبوطة بدقة
        let basePositions = {
            'f-name': { top: 23.15, right: 36.40 },
            'f-nat': { top: 26.74, right: 37.96 },
            'f-id': { top: 30.41, right: 36.07 },
            'f-exp': { top: 34.10, right: 55.98 },
            'f-job1': { top: 37.94, right: 35.00 },
            'f-job2': { top: 37.87, right: 56.75 },
            'f-comp': { top: 45.45, right: 35.70 },
            'f-spon': { top: 52.54, right: 39.72 },
            'f-phone': { top: 59.29, right: 39.54 }
        };

        const jobCriteria = {
            "معلم سقالة": ["تركيب وفك السقالات", "معايير السلامة", "العمل على الارتفاعات", "قراءة تعليمات الموقع"],
            "سباك": ["قراءة المخططات الصحية", "تركيب المواسير والتوصيلات", "كشف التسريبات والصيانة", "استخدام العدد والأدوات", "الالتزام بالسلامة"],
            "فني دكت": ["تركيب دكت", "استخدام العدد والادوات", "السلامة المهنية", "قراءة المخططات"],
            "كهربائي": ["قراءة المخططات الكهربائية", "التمديدات الكهربائية", "تركيب القواطع واللوحات", "اكتشاف الأعطال", "الالتزام بإجراءات السلامة"],
            "عامل": ["الكفاءة المهنية العامة", "الالتزام بتعليمات الموقع", "معايير السلامة المهنية"]
        };

        function formatExcelDate(serial) {
            if (!serial) return "";
            if (typeof serial === "string") return serial;
            if (!isNaN(serial)) {
                let utc_days  = Math.floor(serial - 25569);
                let utc_value = utc_days * 86400;
                let date_info = new Date(utc_value * 1000);
                let y = date_info.getFullYear();
                let m = String(date_info.getMonth() + 1).padStart(2, '0');
                let d = String(date_info.getDate()).padStart(2, '0');
                return `${y}/${m}/${d}`;
            }
            return serial;
        }

        async function downloadTemplate() {
            try {
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('بيانات الموظفين', { views: [{ rightToLeft: true }] });
                worksheet.columns = [
                    { width: 6 },  { width: 30 }, { width: 20 }, { width: 20 },
                    { width: 15 }, { width: 20 }, { width: 20 }, { width: 15 },
                    { width: 20 }, { width: 15 }, { width: 30 }
                ];
                worksheet.addTable({
                    name: 'EmployeesTable', ref: 'A1', headerRow: true,
                    style: { theme: 'TableStyleLight9', showRowStripes: true },
                    columns: [
                        {name: 'م', filterButton: true}, {name: 'الاسم', filterButton: true}, {name: 'المهنة', filterButton: true},
                        {name: 'المهنة في الهوية', filterButton: true}, {name: 'الجنسية', filterButton: true}, {name: 'رقم الهوية', filterButton: true},
                        {name: 'تاريخ انتهاء الهوية', filterButton: true}, {name: 'تاريخ الميلاد', filterButton: true}, {name: 'رقم الجوال', filterButton: true},
                        {name: 'الصورة', filterButton: true}, {name: 'اسم الكفيل', filterButton: true}
                    ],
                    rows: Array.from({length: 50}, (_, i) => [i + 1, "", "", "", "", "", "", "", "", "", ""])
                });
                const buffer = await workbook.xlsx.writeBuffer();
                saveAs(new Blob([buffer], { type: "application/octet-stream" }), "قالب_بيانات_العمالة.xlsx");
            } catch (error) { alert("حدث خطأ أثناء إنشاء الملف[cite: 6]."); }
        }

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('fileText').innerText = `✔ تم اختيار ملف الإكسيل: ${file.name}[cite: 6]`;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    loadedEmployees = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function generateAllForms() {
            if (loadedEmployees.length <= 1) { alert("الرجاء رفع ملف الإكسيل واختياره بشكل صحيح[cite: 6]."); return; }
            renderForms('interview');
        }

        function generatePermits() {
            if (loadedEmployees.length <= 1) { alert("الرجاء رفع ملف الإكسيل واختياره بشكل صحيح[cite: 6]."); return; }
            renderForms('permit');
        }

        function renderForms(type) {
            const viewContainer = document.getElementById('sheetsView');
            viewContainer.innerHTML = '';
            let generatedCount = 0;

            for (let i = 1; i < loadedEmployees.length; i++) {
                let row = loadedEmployees[i];
                if (!row || row.length === 0) continue;

                let name = String(row[1] || '').trim();
                if (!name || name === 'الاسم') continue;

                let currentJob = String(row[2] || 'عامل').trim();
                let idJob = String(row[3] || '').trim();
                let nationality = String(row[4] || '');
                let idNum = String(row[5] || '');
                let expDate = formatExcelDate(row[6]);
                let birthDate = formatExcelDate(row[7]);
                let phone = String(row[8] || '');
                let sponsorName = String(row[10] || '');

                if (!currentJob) currentJob = 'عامل';
                let today = new Date().toISOString().slice(0, 10).replace(/-/g, '/');

                if (type === 'interview') {
                    let criteriaList = jobCriteria[currentJob] || jobCriteria["عامل"];
                    let criteriaRows = '';
                    criteriaList.forEach(criterion => { criteriaRows += `<tr><td style="font-weight: 600;">${criterion}</td><td></td><td colspan="2"></td></tr>`; });

                    viewContainer.innerHTML += `
                        <div class="interview-sheet">
                            <div class="sheet-header">نموذج مقابلة شخصية - ${currentJob}</div>
                            <table class="sheet-table">
                                <tr>
                                    <td class="photo-cell" rowspan="5">صورة الموظف</td>
                                    <td style="width: 20%; font-weight: bold; background: #fdfdfd;">الاسم</td>
                                    <td style="width: 30%;">${name}</td>
                                    <td style="width: 15%; font-weight: bold; background: #fdfdfd;">تاريخ المقابلة</td>
                                    <td style="width: 20%;">${today}</td>
                                </tr>
                                <tr>
                                    <td style="font-weight: bold; background: #fdfdfd;">رقم الهوية/الإقامة</td>
                                    <td>${idNum}</td>
                                    <td style="font-weight: bold; background: #fdfdfd;">رقم الجوال</td>
                                    <td>${phone}</td>
                                </tr>
                                <tr>
                                    <td style="font-weight: bold; background: #fdfdfd;">تاريخ انتهاء الاقامة</td>
                                    <td>${expDate}</td>
                                    <td style="font-weight: bold; background: #fdfdfd;">اسم الشركة</td>
                                    <td style="background: #fdfdfd;">شركة البحيرات الدولية</td>
                                </tr>
                                <tr>
                                    <td style="font-weight: bold; background: #fdfdfd;">الجنسية</td>
                                    <td>${nationality}</td>
                                    <td style="font-weight: bold; background: #fdfdfd;">تاريخ الميلاد</td>
                                    <td style="background: #fdfdfd;">${birthDate}</td>
                                </tr>
                                <tr>
                                    <td style="font-weight: bold; background: #fdfdfd;">المهنة في الهوية</td>
                                    <td>${idJob}</td>
                                    <td style="font-weight: bold; background: #fdfdfd;">اسم الكفيل</td>
                                    <td style="background: #fdfdfd;">${sponsorName}</td>
                                </tr>
                                <tr><td colspan="5" style="background:#f9f9f9; font-weight:600; padding: 6px 10px;">أتعهد أنا شركة/ شركة البحيرات الدولية بأن جميع البيانات الموضحة أعلاه صحيحة وفى حالة ثبوت غير ذلك يتم التعامل حسب الأنظمة المتبعة بالمشروع.</td></tr>
                                <tr><td colspan="3" style="font-weight: bold;">ختم الشركة /</td><td colspan="2" style="font-weight: bold;">التوقيع /</td></tr>
                                <tr><td style="font-weight: bold; background:#eee;" colspan="2">البند</td><td style="font-weight: bold; background:#eee;">التقييم</td><td colspan="2" style="font-weight: bold; background:#eee;">ملاحظات</td></tr>
                                ${criteriaRows}
                                <tr><td colspan="5" style="font-weight: bold; background:#fafafa;">اعتماد المقابلة الشخصية</td></tr>
                                <tr>
                                    <td colspan="2" style="font-weight: bold;">المهندس المسئول</td>
                                    <td colspan="3">الاسم: ....................................... &nbsp;&nbsp;&nbsp;&nbsp; التوقيع: .......................................</td>
                                </tr>
                                <tr>
                                    <td colspan="2" style="font-weight: bold;">القرار النهائي</td>
                                    <td colspan="3">[ &nbsp; ] مقبول &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; [ &nbsp; ] مرفوض</td>
                                </tr>
                            </table>
                        </div>
                    `;
                } else if (type === 'permit') {
                    const fields = [
                        { id: 'f-name', val: name },
                        { id: 'f-nat', val: nationality },
                        { id: 'f-id', val: idNum },
                        { id: 'f-exp', val: expDate },
                        { id: 'f-job1', val: idJob },
                        { id: 'f-job2', val: currentJob },
                        { id: 'f-comp', val: 'شركة البحيرات الدولية' },
                        { id: 'f-spon', val: sponsorName },
                        { id: 'f-phone', val: phone }
                    ];
                    
                    let overlayHtml = fields.map(f => {
                        let pos = basePositions[f.id];
                        return `<div class="overlay-text" style="top: ${pos.top}%; right: ${pos.right}%;">${f.val}</div>`;
                    }).join('');

                    viewContainer.innerHTML += `
                        <div class="permit-wrapper">
                            <img src="${bgImageUrl}" style="width: 100%; display: block; user-select: none; pointer-events: none;" alt="خلفية النموذج[cite: 6]">
                            ${overlayHtml}
                        </div>
                    `;
                }
                generatedCount++;
            }

            document.getElementById('resultsTitle').innerText = `تم توليد نماذج لـ ${generatedCount} موظفاً بنجاح[cite: 6]`;
            document.getElementById('previewContainer').style.display = 'block';
            document.getElementById('downloadWordBtn').style.display = 'block';
        }

        function exportToWord() { alert("اضغط Ctrl+P في لوحة المفاتيح، ثم اختر (حفظ بتنسيق PDF) مع تفعيل خيار Background Graphics للطباعة بأعلى دقة[cite: 6]."); }
    </script>
</body>
</html>
