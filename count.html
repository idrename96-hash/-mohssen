<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلبية السحب النقدي السريع من البنك | البحيرات الدولية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3c72;
            --primary-light: #2a5298;
            --accent: #00b09b;
            --accent-hover: #008374;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-gray: #666666;
            --border-color: #e1e4e8;
            --bank-color: #f39c12;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .back-btn {
            background-color: var(--primary);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background-color: var(--accent);
        }

        h2 {
            color: var(--primary);
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            resize: vertical;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: var(--primary-light);
        }

        .btn {
            background: linear-gradient(to left, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.2);
        }

        .btn:hover {
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
            transform: translateY(-2px);
        }

        #bankSummary {
            display: none;
            margin-top: 30px;
            border-top: 3px dashed var(--bank-color);
            padding-top: 20px;
        }

        .bank-title {
            color: var(--bank-color);
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
        }

        .summary-box {
            background: #fffdfa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #fae5d3;
        }

        .summary-box .title {
            display: block;
            color: #666;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .summary-box .count {
            display: block;
            font-size: 26px;
            color: var(--bank-color);
            font-weight: 800;
            line-height: 1.1;
        }

        .summary-box .sub-val {
            display: block;
            font-size: 12px;
            color: #888;
            font-weight: 600;
            margin-top: 4px;
        }

        .total-badge {
            text-align: center;
            background: #e6fffa;
            border: 1px solid #b2f5ea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 18px;
            color: #234e52;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>حساب طلبية البنك من الرواتب المباشرة</h2>
            <a href="index.html" class="back-btn">العودة للرئيسية</a>
        </div>

        <div class="form-group">
            <label for="salaries-input">الصق رواتب الموظفين هنا (كل راتب في سطر منفصل):</label>
            <textarea id="salaries-input" placeholder="مثال:
3120
4320
2880
3936"></textarea>
        </div>

        <button class="btn" onclick="calculateBankRequest()">🧮 حساب طلبية السحب من البنك</button>

        <!-- خلاصة البنك -->
        <div id="bankSummary">
            <h3 class="bank-title">🏦 طلبية السحب النقدي من البنك</h3>
            <div class="total-badge" id="grandTotalText">إجمالي المطلوب سحبه: 0 ريال</div>
            <div class="summary-grid" id="summaryGrid"></div>
        </div>
    </div>

    <script>
        // فئات العملات مرتبة تنازلياً
        const denominations = [500, 200, 100, 50, 20, 10, 5, 1];

        function calculateBankRequest() {
            const textValue = document.getElementById('salaries-input').value;
            // فصل السطور وتحويل القيم لأرقام صحيحة وتصفية القيم الفارغة أو غير الرقمية
            const lines = textValue.split('\n');
            
            let bankTotals = { sum: 0 };
            denominations.forEach(d => bankTotals[d] = 0);

            let hasValues = false;

            lines.forEach(line => {
                let cleanVal = parseFloat(line.trim());
                if (!isNaN(cleanVal) && cleanVal > 0) {
                    hasValues = true;
                    let salary = Math.round(cleanVal);
                    bankTotals.sum += salary;

                    // تفكيك الراتب على فئات العملات
                    let remaining = salary;
                    denominations.forEach(denom => {
                        let count = Math.floor(remaining / denom);
                        bankTotals[denom] += count;
                        remaining = remaining % denom;
                    });
                }
            });

            if (!hasValues) {
                alert("الرجاء إدخال رواتب صحيحة (كل راتب في سطر).");
                return;
            }

            // عرض النتائج
            document.getElementById('grandTotalText').innerText = `إجمالي المطلوب سحبه: ${bankTotals.sum.toLocaleString()} ريال`;
            
            const grid = document.getElementById('summaryGrid');
            grid.innerHTML = '';
            
            denominations.forEach(denom => {
                const count = bankTotals[denom];
                const totalValue = count * denom; // القيمة الإجمالية لهذه الفئة بالريال
                
                const div = document.createElement('div');
                div.className = 'summary-box';
                div.innerHTML = `
                    <span class="title">ورقة فئة ${denom}</span>
                    <span class="count">${count.toLocaleString()}</span>
                    <span class="sub-val">${totalValue.toLocaleString()} ريال</span>
                `;
                grid.appendChild(div);
            });

            document.getElementById('bankSummary').style.display = 'block';
        }
    </script>

</body>
</html>
