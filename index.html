<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة فئات الرواتب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0E1F1C; --teal: #12332E; --teal2: #1B4A42; 
    --gold: #C9A227; --gold-soft: #E4C868; --paper: #F6F2E7; --line: #2E5A51;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink); color: var(--paper);
    font-family: 'Tajawal', sans-serif; padding: 24px 16px 60px;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 900; margin: 0 0 4px; color: var(--gold-soft); }
  .sub { font-size: 14px; color: #B9CFC9; margin: 0 0 16px; line-height: 1.7; }
  .card {
    background: var(--teal); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  textarea {
    width: 100%; min-height: 150px; background: var(--ink); color: var(--paper);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font-family: inherit; font-size: 16px; resize: vertical; margin-bottom: 12px;
    line-height: 1.5;
  }
  button {
    width: 100%; text-align: center; cursor: pointer;
    background: var(--gold); color: var(--ink); border: none;
    border-radius: 8px; padding: 14px; font-family: inherit; font-size: 16px;
    font-weight: 700; transition: background .15s;
  }
  button:hover { background: var(--gold-soft); }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; text-align: center; }
  th, td { border: 1px solid var(--line); padding: 10px; }
  th { background: var(--teal2); color: var(--gold-soft); font-weight: 700; }
  td { background: var(--ink); }
  .total-row td { background: var(--teal2); color: #fff; font-weight: bold; }
  .total-label { color: var(--gold-soft); font-size: 16px;}
  .highlight { color: #fff; font-weight: bold; }
  .dim { color: #44665f; }
</style>
</head>
<body>
<div class="wrap">
  <h1>حاسبة فئات الرواتب النقدية</h1>
  <p class="sub">الصق مبالغ الرواتب هنا (كل راتب في سطر منفصل) لتحليل الفئات المطلوبة للصرف.</p>

  <div class="card">
    <textarea id="salariesInput" placeholder="الصق الرواتب هنا...&#10;مثال:&#10;3720&#10;4150&#10;2895"></textarea>
    <button onclick="calculateDenominations()">احسب الفئات</button>
  </div>

  <div class="card" id="resultCard" style="display: none;">
    <h3 style="margin-top:0; color:var(--gold-soft);">جدول الصرف التفصيلي</h3>
    <div style="overflow-x: auto;">
      <table id="resultTable">
        <thead>
          <tr>
            <th>الراتب</th>
            <th>500</th>
            <th>200</th>
            <th>100</th>
            <th>50</th>
            <th>20</th>
            <th>10</th>
            <th>5</th>
            <th>1</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </div>
</div>

<script>
function calculateDenominations() {
  const input = document.getElementById('salariesInput').value;
  const lines = input.split('\n');
  const denominations = [500, 200, 100, 50, 20, 10, 5, 1];
  
  // سجل لإجمالي عدد الأوراق المطلوبة من كل فئة
  let grandTotals = { 500: 0, 200: 0, 100: 0, 50: 0, 20: 0, 10: 0, 5: 0, 1: 0 };
  let totalSalariesSum = 0;
  
  const tableBody = document.getElementById('tableBody');
  const tableFoot = document.getElementById('tableFoot');
  tableBody.innerHTML = '';
  tableFoot.innerHTML = '';

  let hasValidData = false;

  lines.forEach(line => {
    // تنظيف النص والتأكد أنه رقم صالح (يسمح بالأرقام فقط)
    let amountStr = line.replace(/[^\d.]/g, '');
    let amount = parseFloat(amountStr);
    
    // تخطي الأسطر الفارغة أو غير الصالحة
    if (isNaN(amount) || amount <= 0) return;
    
    hasValidData = true;
    totalSalariesSum += amount;
    
    let rowHtml = `<tr><td style="font-weight:bold; color:var(--gold-soft);">${amount}</td>`;
    let remaining = amount;

    denominations.forEach(den => {
      let count = Math.floor(remaining / den);
      grandTotals[den] += count;
      remaining = remaining % den;
      
      // تنسيق الخلية: إذا كان العدد 0 نضع شرطة، وإذا كان أكبر من 0 نبرزه
      let cellClass = count > 0 ? 'highlight' : 'dim';
      let cellText = count > 0 ? count : '-';
      rowHtml += `<td class="${cellClass}">${cellText}</td>`;
    });
    
    rowHtml += '</tr>';
    tableBody.innerHTML += rowHtml;
  });

  if (hasValidData) {
    document.getElementById('resultCard').style.display = 'block';
    
    // بناء صف الإجماليات (أهم جزء لسحب النقدية من البنك)
    let footHtml = `<tr class="total-row"><td class="total-label">الإجمالي:<br>${totalSalariesSum}</td>`;
    denominations.forEach(den => {
      footHtml += `<td>${grandTotals[den]}<br><span style="font-size:11px; font-weight:normal; color:#A7C7C0;">ورقة</span></td>`;
    });
    footHtml += '</tr>';
    tableFoot.innerHTML = footHtml;
  } else {
    alert("برجاء إدخال مبالغ صحيحة في المربع.");
  }
}
</script>
</body>
</html>
