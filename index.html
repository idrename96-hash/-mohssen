<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحيرات الدولية | الصفحة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3c72;
            --primary-light: #2a5298;
            --accent: #00b09b;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-gray: #666666;
            --border-color: #e1e4e8;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--primary);
            font-weight: 800;
            margin: 0;
            font-size: 38px;
        }

        .header p {
            color: var(--text-gray);
            margin-top: 10px;
            font-size: 18px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-top: 30px;
        }

        @media (min-width: 768px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 25px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(to left, var(--primary), var(--primary-light));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .card:hover .icon-circle {
            background: linear-gradient(to left, var(--accent), #1de9b6);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: var(--primary);
        }

        .card p {
            margin: 0;
            color: var(--text-gray);
            font-size: 14px;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            color: var(--text-gray);
            font-size: 14px;
            padding-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>شركة البحيرات الدولية</h1>
            <p>شركة البحيرات الدولية للمقاولات والإنشاءات</p>
        </div>

        <div class="services-grid">
            <a href="payroll.html" class="card">
                <div class="icon-circle">📊</div>
                <h3>نظام الرواتب والفئات</h3>
                <p>إدارة كشوفات الحضور وحساب الرواتب والفئات النقدية</p>
            </a>

            <a href="iqama.html" class="card">
                <div class="icon-circle">📄</div>
                <h3>قراءة وتحديث الإقامات</h3>
                <p>نظام استخراج وقراءة بيانات الإقامات والمستندات</p>
            </a>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 [ NEGM ] البحيرات الدولية. جميع الحقوق محفوظة.
    </div>

</body>
</html>
